name: Update Threat Feeds

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch threat feeds
        shell: pwsh
        run: pwsh scripts/fetch-feeds.ps1

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed-data.json
          git diff --cached --quiet || git commit -m "Update feed data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
